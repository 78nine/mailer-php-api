[general]
api_token = SECRET_API_TOKEN

; Rate limiting (optional)
rate_limit_enabled = true
rate_limit_max = 10
rate_limit_window = 60

; Attachment size limits (in bytes, optional)
max_attachment_size = 10485760      ; 10MB per attachment
max_total_attachments_size = 20971520  ; 20MB total

; CORS settings (optional, for browser-based requests)
cors_enabled = false
; cors_origin = *  ; Allow all origins, or specify: https://yourdomain.com

[email]
to_email = john@example.com
from_email = john@example.com
from_name = John Doe
smtp_host = smtp.example.com
smtp_user = USERNAME
smtp_pass = PASSWORD
smtp_port = 587
; bcc = archive@example.com, admin@example.com
